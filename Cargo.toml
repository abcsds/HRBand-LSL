[package]
name = "hrband-lsl"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of HRBand-LSL: BLE heart rate monitoring with Lab Streaming Layer integration"
license = "MIT"
repository = "https://github.com/example/HRBand-LSL"
keywords = ["ble", "heart-rate", "lsl", "real-time", "streaming"]
authors = ["Claude Code"]
readme = "README.rust.md"

[dependencies]
btleplug = "0.11"
lsl = { version = "0.1", optional = true }
tokio = { version = "1.35", features = ["full"] }
inquire = "0.7"
anyhow = "1.0"
uuid = "1.6"
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["lsl"]
lsl = ["dep:lsl"]
